# Netlify reads this file on every deploy.
[build]
  publish = "public"              # the website files
  functions = "netlify/functions" # small server code (Stripe checkout)

[functions]
  node_bundler = "esbuild"

# Cache photos for a long time; always re-check the page itself.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only load what the page needs. Checkout is a redirect to Stripe's own page, so no Stripe.js here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://checkout.stripe.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# The admin page: never indexed, never cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
